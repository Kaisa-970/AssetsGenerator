<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>照片到资产 · 节点工作台</title>
<style>
:root{color-scheme:dark;font:14px system-ui;color:#e6edf5;background:#10151d}*{box-sizing:border-box}body{margin:0}header{padding:20px 28px;border-bottom:1px solid #303b48;display:flex;align-items:center;gap:20px}h1{font-size:20px;margin:0}small,.hint{color:#9fadc0}main{padding:24px;max-width:1500px;margin:auto}.nodes{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}.node{border:1px solid #394757;border-radius:10px;padding:18px;background:#18212d}.node strong{display:block;margin-bottom:10px}.node[data-status=succeeded]{border-color:#4eae95}.node[data-status=running],.node[data-status=waiting_for_input]{border-color:#e5b75c}.body{display:grid;grid-template-columns:320px 1fr;gap:24px}.panel{background:#18212d;border:1px solid #303b48;border-radius:10px;padding:20px}label{display:block;margin:15px 0}input,select,button{font:inherit}input[type=text],select{width:100%;padding:10px;border:1px solid #49586d;border-radius:5px;background:#10151d;color:inherit}button{padding:10px 15px;background:#263548;border:1px solid #53657b;border-radius:5px;color:inherit;cursor:pointer}button.primary{background:#286e60;border-color:#58ad97}button:disabled{opacity:.45;cursor:default}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}#message{white-space:pre-wrap;color:#e5b75c;min-height:24px}#canvas{max-width:100%;max-height:65vh;object-fit:contain}#viewer{min-height:250px;display:grid;place-items:center;background:#10151d;border-radius:7px}#proposals{max-height:240px;overflow:auto}#proposals label{border-bottom:1px solid #303b48;padding-bottom:10px}.output{display:block;color:#83d5c1;margin:10px 0}model-viewer{width:100%;height:55vh}#run-id{overflow-wrap:anywhere}h2{font-size:17px}details{margin-top:20px}pre{white-space:pre-wrap;overflow-wrap:anywhere} @media(max-width:800px){.nodes{grid-template-columns:1fr 1fr}.body{grid-template-columns:1fr}header{display:block}main{padding:12px}}
</style>
<header><h1>照片到资产</h1><small>固定流程工作台 · photo_object_asset@1</small></header>
<main>
<div class="nodes" aria-label="管线步骤">
<div class="node" id="node-import"><strong>01 导入照片</strong><span>选择一张物体照片</span></div>
<div class="node" id="node-propose"><strong>02 SAM 候选</strong><span>待运行</span></div>
<div class="node" id="node-select"><strong>03 人工选择</strong><span>待运行</span></div>
<div class="node" id="node-generate"><strong>04 生成与发布</strong><span>待运行</span></div>
</div>
<div class="body"><aside class="panel">
<h2>新建运行</h2><label>照片<input id="photo" type="file" accept="image/jpeg,image/png,image/webp"></label>
<label>生成模型<select id="backend"></select></label><label>生成分辨率<select id="resolution"><option value="512">512</option><option value="1024">1024</option></select></label><label>随机种子<input id="seed" type="text" value="42" inputmode="numeric"></label><p class="hint">TripoSR 不使用这里的种子和生成分辨率，其网格分辨率来自服务配置。</p><button id="create" class="primary" disabled>上传并开始</button>
<label>恢复已有运行<select id="runs"><option value="">选择运行</option></select></label>
<p id="run-id" class="hint"></p>
<section id="review" hidden><h2>选择一个区域</h2><div id="proposals"></div>
<label><input id="invert" type="checkbox"> 取反（选中了背景时使用）</label>
<label><input id="largest" type="checkbox"> 仅保留最大连通区域</label>
<p class="hint">彩色区域将用于生成。先取反再清理，请检查细小部件是否被移除。</p>
<button id="preview">更新预览</button><label>检查人<input id="reviewer" type="text" maxlength="200" placeholder="姓名或标识"></label>
<button id="confirm" class="primary" disabled>确认区域并生成</button></section>
<div class="actions"><button id="retry" hidden>重试失败步骤</button></div>
</aside><section class="panel"><div id="viewer"><canvas id="canvas"></canvas><p id="empty" class="hint">上传照片开始；已有运行可从左侧恢复。</p></div>
<p id="message" role="status" aria-live="polite"></p><div id="outputs"></div><div id="qa">质量：未评估</div>
<details><summary>运行详情</summary><pre id="details"></pre></details></section></div></main>
<script>
'use strict';
const $=id=>document.getElementById(id),names={pending:'待运行',running:'运行中',waiting_for_input:'等待人工选择',succeeded:'已完成',failed:'失败',interrupted:'中断'};
let previewLoaded=false;
let token='',current=null,busy=false,dirty=false,drawVersion=0,previewSignature='',pendingCommand=null,polling=false,viewEpoch=0;
const requestId=()=>crypto.randomUUID();
function readPending(){try{return JSON.parse(sessionStorage.getItem('workbench.pending')||'null')}catch{return null}}
pendingCommand=readPending();
async function durableCommand(path,body){const business={...body};delete business.expected_revision;delete business.idempotency_key;const fingerprint=JSON.stringify([path,business]);if(pendingCommand&&pendingCommand.fingerprint!==fingerprint)throw Error('有一个响应未确认的命令，请先重试原操作以查明结果。');if(!pendingCommand){pendingCommand={fingerprint,path,body:{...body,idempotency_key:requestId()}};sessionStorage.setItem('workbench.pending',JSON.stringify(pendingCommand))}try{const result=await api(pendingCommand.path,pendingCommand.body);sessionStorage.removeItem('workbench.pending');pendingCommand=null;return result}catch(error){if(error.status===400||error.status===409||error.status===404){sessionStorage.removeItem('workbench.pending');pendingCommand=null}throw error}}

function message(text){$('message').textContent=text}
async function api(path,body,raw=false){const options=body===undefined?{}:{method:'POST',headers:{'X-Workbench-Token':token,'Content-Type':raw?'application/octet-stream':'application/json'},body:raw?body:JSON.stringify(body)};const response=await fetch(path,options);const result=await response.json();if(!response.ok){const error=Error(result.error||'请求失败');error.status=response.status;throw error;}return result}
function image(url){return new Promise((resolve,reject)=>{const value=new Image();value.onload=()=>resolve(value);value.onerror=()=>reject(Error('无法加载预览图像'));value.src=url})}
function signature(){return JSON.stringify([document.querySelector('input[name=proposal]:checked')?.value,$('invert').checked,$('largest').checked])}
function invalidate(){dirty=true;previewSignature='';previewLoaded=false;$('confirm').disabled=true;draw(current?.image_url);message('区域已修改，请更新预览后确认。')}
async function draw(sourceUrl,maskUrl){const version=++drawVersion;previewLoaded=false;$('confirm').disabled=true;if(!sourceUrl)return;try{const source=await image(sourceUrl),mask=maskUrl?await image(maskUrl):null;if(version!==drawVersion)return;const canvas=$('canvas'),ctx=canvas.getContext('2d');canvas.width=source.naturalWidth;canvas.height=source.naturalHeight;ctx.drawImage(source,0,0);$('empty').hidden=true;if(mask){const temp=document.createElement('canvas');temp.width=canvas.width;temp.height=canvas.height;const tc=temp.getContext('2d');tc.drawImage(mask,0,0);const pixels=tc.getImageData(0,0,temp.width,temp.height);for(let i=0;i<pixels.data.length;i+=4){const foreground=pixels.data[i]===255;pixels.data[i]=65;pixels.data[i+1]=211;pixels.data[i+2]=168;pixels.data[i+3]=foreground?145:0}tc.putImageData(pixels,0,0);ctx.drawImage(temp,0,0);previewLoaded=true;$('confirm').disabled=busy||signature()!==previewSignature}}catch(error){if(version===drawVersion)message(error.message)}}
function render(run){if(run.background_error)message('后台执行错误：'+run.background_error);const changed=current?.run_id!==run.run_id;current=run;$('run-id').textContent=run.run_id;$('details').textContent=JSON.stringify(run,null,2);$('node-import').dataset.status='succeeded';$('node-import').querySelector('span').textContent='已导入';for(const stage of run.stages||[]){const node=$('node-'+stage.stage_id);if(node){node.dataset.status=stage.status;node.querySelector('span').textContent=(names[stage.status]||stage.status)+(stage.execution_mode==='restored'?' · 已恢复':'')+(stage.error?' · '+stage.error:'')}}
const review=run.review;$('review').hidden=!review||review.confirmed===true;$('retry').hidden=!['failed','interrupted'].includes(run.status);if(changed){dirty=false;previewSignature='';$('outputs').replaceChildren();document.querySelector('model-viewer')?.remove()}
if(review&&!dirty){const draft=review.draft;$('proposals').replaceChildren(...(review.items||[]).map(item=>{const label=document.createElement('label'),radio=document.createElement('input');radio.type='radio';radio.name='proposal';radio.value=item.proposal_id;radio.checked=draft?.proposal_id===item.proposal_id;radio.onchange=invalidate;label.append(radio,document.createTextNode(' '+item.proposal_id+' · '+item.area+' 像素'));return label}));$('invert').checked=draft?.invert||false;$('largest').checked=draft?.keep_largest||false;if(draft?.mask_url){previewSignature=signature();$('confirm').disabled=!previewLoaded}else{$('confirm').disabled=true}draw(run.image_url,draft?.mask_url)}else if(changed||!review)draw(run.image_url);
$('outputs').replaceChildren(...(run.outputs||[]).map(item=>{const link=document.createElement('a');link.className='output';link.href=item.url;link.textContent=item.label||item.key;link.download='';return link}));const glb=(run.outputs||[]).find(item=>item.key==='glb');if(glb){const button=document.createElement('button');button.textContent='查看模型';button.onclick=()=>showModel(glb.url);$('outputs').append(button)}$('qa').textContent=run.qa?.length?'质量检查：'+run.qa.map(item=>item.check+' — '+item.status).join('；'):'质量：未评估';}
async function showModel(url){const epoch=viewEpoch,runId=current?.run_id;try{if(!customElements.get('model-viewer')){message('正在加载模型查看器…');await import('https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js')}if(epoch!==viewEpoch||current?.run_id!==runId)return;document.querySelector('model-viewer')?.remove();const model=document.createElement('model-viewer');model.src=url;model.setAttribute('camera-controls','');model.setAttribute('auto-rotate','');model.setAttribute('alt','生成的资产');model.addEventListener('error',()=>message('模型加载失败，可以下载 GLB 后在本地查看。'));$('viewer').after(model);message('')}catch(error){if(epoch!==viewEpoch||current?.run_id!==runId)return;message('模型查看器加载失败（需要访问外部 CDN）。可下载 GLB 后在本地查看。')}}
async function refresh(){if(!current)return;const runId=current.run_id,epoch=viewEpoch;const run=await api('/runs/'+runId);if(epoch!==viewEpoch||current?.run_id!==runId||run.revision<current.revision)return;render(run)}
async function listRuns(){const result=await api('/runs');const selected=current?.run_id;$('runs').replaceChildren(new Option('选择运行',''),...result.runs.map(run=>new Option(run.run_id+' · '+(names[run.status]||run.status),run.run_id)));if(selected)$('runs').value=selected}
async function action(work){if(busy)return;busy=true;viewEpoch++;for(const control of document.querySelectorAll('button,input,select'))control.disabled=true;try{await work()}catch(error){message(error.message);try{await refresh()}catch{}}finally{busy=false;for(const control of document.querySelectorAll('input,select'))control.disabled=false;$('create').disabled=!$('photo').files.length||!$('backend').value;$('preview').disabled=false;$('confirm').disabled=!previewLoaded||!previewSignature||previewSignature!==signature();$('retry').disabled=false}}
$('photo').onchange=()=>{$('create').disabled=!$('photo').files.length||!$('backend').value};$('invert').onchange=invalidate;$('largest').onchange=invalidate;
$('create').onclick=()=>action(async()=>{const file=$('photo').files[0];if(!file)return;message('正在上传照片…');const imported=await api('/inputs',file,true);const body={image:imported.image,shape_profile:$('backend').value,parameters:{seed:Number($('seed').value),pipeline_type:$('resolution').value}};if(!Number.isInteger(body.parameters.seed)||body.parameters.seed<0||body.parameters.seed>=2**32)throw Error('随机种子需要是 0 到 4294967295 的整数。');const run=await durableCommand('/runs',body);dirty=false;render(run);await listRuns();message('运行已创建，等待 SAM 候选。')});
$('runs').onchange=()=>action(async()=>{if(!$('runs').value)return;dirty=false;previewSignature='';render(await api('/runs/'+$('runs').value));message('已恢复运行记录。')});
$('preview').onclick=()=>action(async()=>{const proposal=document.querySelector('input[name=proposal]:checked')?.value;if(!proposal)throw Error('请选择一个候选。');await api('/runs/'+current.run_id+'/mask-preview',{expected_revision:current.revision,proposal_id:proposal,invert:$('invert').checked,keep_largest:$('largest').checked});dirty=false;await refresh();message('预览已保存，请检查彩色区域后确认。')});
$('confirm').onclick=()=>action(async()=>{const reviewer=$('reviewer').value.trim();if(!reviewer)throw Error('请填写检查人。');if(!previewLoaded||signature()!==previewSignature)throw Error('请先更新并加载预览。');const body={expected_revision:current.revision,reviewer};await durableCommand('/runs/'+current.run_id+'/decision',body);dirty=false;await refresh();message('区域已确认，生成将在后台继续。')});
$('retry').onclick=()=>action(async()=>{await durableCommand('/runs/'+current.run_id+'/retry',{expected_revision:current.revision});await refresh();message('已提交重试。')});
(async()=>{try{const session=await api('/session');token=session.token;$('backend').replaceChildren(...session.catalog.backends.map(item=>new Option(item.label||item.id,item.id)));await listRuns();message(pendingCommand?'正在核对上次命令…':'请选择照片或恢复已有运行。');if(pendingCommand){const restored=await durableCommand(pendingCommand.path,pendingCommand.body);render(restored);await listRuns();message('上次命令已核对，运行记录已恢复。')}setInterval(async()=>{if(busy||polling||!current)return;polling=true;try{await refresh()}catch(error){message('连接中断：'+error.message+'。后端记录保留，恢复服务后刷新页面。')}finally{polling=false}},2000)}catch(error){message('初始化失败：'+error.message)}})();
</script></html>
