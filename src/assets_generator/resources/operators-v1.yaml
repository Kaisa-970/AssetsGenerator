operators:
  - name: resize_image
    version: 1
    inputs:
      image: {kind: rgb_image, carriers: [artifact_ref], schema_name: png, schema_version: "1.0"}
    outputs:
      image: {kind: rgb_image, carriers: [artifact_ref], schema_name: png, schema_version: "1.0"}

  - name: encode_png
    version: 1
    inputs:
      image: {kind: rgb_image, carriers: [artifact_ref], schema_name: raster_image, schema_version: "1.0"}
    outputs:
      image: {kind: rgb_image, carriers: [artifact_ref], schema_name: png, schema_version: "1.0"}

  - name: apply_binary_mask
    version: 1
    relations:
      - validator: matched_image_mask@1
        inputs: [image, mask]
    inputs:
      image: {kind: rgb_image, carriers: [artifact_ref]}
      mask: {kind: binary_mask, carriers: [artifact_ref], schema_name: png, schema_version: "1.0"}
    outputs:
      rgba: {kind: rgba_image, carriers: [artifact_ref], schema_name: png, schema_version: "1.0"}

  - name: image_transform
    version: 1
    inputs:
      image: {kind: rgb_image, carriers: [artifact_ref], schema_name: png, schema_version: "1.0"}
    outputs:
      image: {kind: rgb_image, carriers: [artifact_ref], schema_name: png, schema_version: "1.0"}
      evidence: {kind: remote_job_result, carriers: [artifact_ref], schema_name: ComfyImageBoundary, schema_version: "1.0"}

  - name: segmentation
    version: 1
    inputs:
      image: {kind: rgb_image, carriers: [artifact_ref]}
      mask: {kind: binary_mask, cardinality: zero_or_one, carriers: [artifact_ref]}
    outputs:
      mask: {kind: binary_mask, carriers: [artifact_ref]}
      result: {kind: segmentation_result, carriers: [structured]}

  - name: prepare_observation
    version: 1
    inputs:
      image: {kind: rgb_image, carriers: [artifact_ref]}
      mask: {kind: binary_mask, carriers: [artifact_ref]}
    outputs:
      bundle: {kind: observation_bundle, carriers: [structured], schema_name: ObservationBundle, schema_version: "1.0", persist: true}
      rgba: {kind: rgba_image, carriers: [artifact_ref]}
      image_warp: {kind: image_warp, carriers: [structured]}

  - name: geometry_frontend
    version: 1
    inputs:
      observations: {kind: observation_bundle, carriers: [artifact_ref], schema_name: ObservationBundle, schema_version: "1.0"}
    outputs:
      cameras: {kind: camera_record, cardinality: one_or_more, carriers: [structured], schema_name: CameraRecord, schema_version: "1.0"}
      depths: {kind: depth_map, cardinality: zero_or_more, carriers: [artifact_ref], requires_frame: true, requires_unit: true}
      points: {kind: point_cloud, carriers: [artifact_ref], requires_frame: true, requires_unit: true}

  - name: reconstruction
    version: 1
    inputs:
      observations: {kind: observation_bundle, carriers: [artifact_ref], schema_name: ObservationBundle, schema_version: "1.0"}
      cameras: {kind: camera_record, cardinality: one_or_more, carriers: [structured], schema_name: CameraRecord, schema_version: "1.0"}
      depths: {kind: depth_map, cardinality: zero_or_more, carriers: [artifact_ref], requires_frame: true, requires_unit: true}
      points: {kind: point_cloud, carriers: [artifact_ref], requires_frame: true, requires_unit: true}
    outputs:
      mesh: {kind: triangle_mesh, carriers: [artifact_ref], requires_frame: true, requires_unit: true}
      material: {kind: pbr_material, carriers: [structured], schema_name: PBRMaterial, schema_version: "1.0"}
      native_frame: {kind: backend_native_frame, carriers: [structured], schema_name: BackendNativeFrame, schema_version: "1.0"}
      components: {kind: component_provenance, cardinality: one_or_more, carriers: [structured], schema_name: ComponentProvenance, schema_version: "1.0"}

  - name: masked_shape_generation
    version: 1
    relations:
      - validator: matched_image_mask@1
        inputs: [image, mask]
    inputs:
      image: {kind: rgb_image, carriers: [artifact_ref]}
      mask: {kind: binary_mask, carriers: [artifact_ref], schema_name: png, schema_version: "1.0"}
    outputs:
      mesh: {kind: triangle_mesh, carriers: [artifact_ref], requires_frame: true, requires_unit: true}
      material: {kind: pbr_material, carriers: [structured], schema_name: PBRMaterial, schema_version: "1.0"}
      native_frame: {kind: backend_native_frame, carriers: [structured]}
      sam3d_evidence: {kind: remote_job_result, carriers: [artifact_ref], schema_name: Sam3DResult, schema_version: "1.0"}
      actual_mask: {kind: binary_mask, carriers: [artifact_ref], schema_name: png, schema_version: "1.0"}

  - name: shape_generation
    version: 1
    inputs:
      image: {kind: rgba_image, carriers: [artifact_ref]}
    outputs:
      mesh: {kind: triangle_mesh, carriers: [artifact_ref], requires_frame: true, requires_unit: true}
      material: {kind: pbr_material, carriers: [structured], schema_name: PBRMaterial, schema_version: "1.0"}
      native_frame: {kind: backend_native_frame, carriers: [structured]}

  - name: canonicalize
    version: 1
    relations:
      - validator: native_mesh_frame@1
        inputs: [mesh, native_frame]
    inputs:
      mesh: {kind: triangle_mesh, carriers: [artifact_ref], requires_frame: true, requires_unit: true}
      native_frame: {kind: backend_native_frame, carriers: [structured]}
      components: {kind: component_provenance, cardinality: zero_or_more, carriers: [structured], schema_name: ComponentProvenance, schema_version: "1.0"}
    outputs:
      mesh: {kind: triangle_mesh, carriers: [artifact_ref], requires_frame: true, requires_unit: true}
      canonical_frame: {kind: frame, carriers: [structured]}
      transform: {kind: spatial_transform, carriers: [structured]}
      spatial_info: {kind: asset_spatial_info, carriers: [structured]}
      components: {kind: component_provenance, cardinality: zero_or_more, carriers: [structured], schema_name: ComponentProvenance, schema_version: "1.0"}

  - name: geometry_validation
    version: 1
    relations:
      - validator: canonical_mesh_source@1
        inputs: [mesh, source_mesh]
    inputs:
      mesh: {kind: triangle_mesh, carriers: [artifact_ref], requires_frame: true, requires_unit: true}
      source_mesh: {kind: triangle_mesh, carriers: [artifact_ref], requires_frame: true, requires_unit: true}
    outputs:
      report: {kind: quality_report, carriers: [artifact_ref], schema_name: QualityReport, schema_version: "1.0"}

  - name: validation
    version: 1
    inputs:
      mesh: {kind: triangle_mesh, carriers: [artifact_ref], requires_frame: true, requires_unit: true}
      material: {kind: pbr_material, carriers: [structured]}
    outputs:
      report: {kind: quality_report, carriers: [structured], persist: true}

  - name: collision_generation
    version: 1
    inputs:
      mesh: {kind: triangle_mesh, carriers: [artifact_ref], requires_frame: true, requires_unit: true}
    outputs:
      collision: {kind: collision_mesh, carriers: [artifact_ref], requires_frame: true, requires_unit: true}

  - name: collision_validation
    version: 1
    inputs:
      collision: {kind: collision_mesh, carriers: [artifact_ref], requires_frame: true, requires_unit: true}
      provenance: {kind: provenance_record, carriers: [artifact_ref]}
    outputs:
      report: {kind: quality_report, carriers: [artifact_ref], schema_name: QualityReport, schema_version: "1.0"}

  - name: collision_asset_derivation
    version: 1
    inputs:
      source_asset: {kind: asset_definition, carriers: [artifact_ref]}
      collision: {kind: collision_mesh, carriers: [artifact_ref], requires_frame: true, requires_unit: true}
      quality: {kind: quality_report, carriers: [artifact_ref]}
    outputs:
      asset: {kind: asset_definition, carriers: [artifact_ref]}

  - name: collision_export
    version: 1
    inputs:
      collision: {kind: collision_mesh, carriers: [artifact_ref], requires_frame: true, requires_unit: true}
    outputs:
      glb: {kind: gltf_asset, carriers: [artifact_ref], requires_frame: true, requires_unit: true}

  - name: collision_release
    version: 1
    inputs:
      source_release: {kind: asset_release, carriers: [artifact_ref]}
      asset: {kind: asset_definition, carriers: [artifact_ref]}
      glb: {kind: gltf_asset, carriers: [artifact_ref], requires_frame: true, requires_unit: true}
      quality: {kind: quality_report, carriers: [artifact_ref]}
    outputs:
      release: {kind: asset_release, carriers: [artifact_ref]}

  - name: metric_scale_measurement_import
    version: 1
    inputs: {}
    outputs:
      measurement: {kind: metric_scale_measurement, carriers: [artifact_ref], schema_name: MetricScaleMeasurement, schema_version: "1.0"}

  - name: metric_scale_calibration
    version: 1
    inputs:
      source_asset: {kind: asset_definition, carriers: [artifact_ref]}
      measurement: {kind: metric_scale_measurement, carriers: [artifact_ref], schema_name: MetricScaleMeasurement, schema_version: "1.0"}
      visual: {kind: triangle_mesh, carriers: [artifact_ref], requires_frame: true, requires_unit: true}
      collision: {kind: collision_mesh, cardinality: zero_or_one, carriers: [artifact_ref], requires_frame: true, requires_unit: true}
    outputs:
      asset: {kind: asset_definition, carriers: [artifact_ref]}
      visual: {kind: triangle_mesh, carriers: [artifact_ref], requires_frame: true, requires_unit: true}
      collision: {kind: collision_mesh, cardinality: zero_or_one, carriers: [artifact_ref], requires_frame: true, requires_unit: true}
      report: {kind: quality_report, carriers: [artifact_ref]}

  - name: metric_scale_export
    version: 1
    inputs:
      visual: {kind: triangle_mesh, carriers: [artifact_ref], requires_frame: true, requires_unit: true}
      collision: {kind: collision_mesh, cardinality: zero_or_one, carriers: [artifact_ref], requires_frame: true, requires_unit: true}
    outputs:
      visual_glb: {kind: gltf_asset, carriers: [artifact_ref], requires_frame: true, requires_unit: true}
      collision_glb: {kind: gltf_asset, cardinality: zero_or_one, carriers: [artifact_ref], requires_frame: true, requires_unit: true}

  - name: metric_scale_release
    version: 1
    inputs:
      source_release: {kind: asset_release, carriers: [artifact_ref]}
      asset: {kind: asset_definition, carriers: [artifact_ref]}
      visual_glb: {kind: gltf_asset, carriers: [artifact_ref], requires_frame: true, requires_unit: true}
      collision_glb: {kind: gltf_asset, cardinality: zero_or_one, carriers: [artifact_ref], requires_frame: true, requires_unit: true}
      report: {kind: quality_report, carriers: [artifact_ref]}
    outputs:
      release: {kind: asset_release, carriers: [artifact_ref]}

  - name: rigid_body_properties_import
    version: 1
    inputs: {}
    outputs:
      properties: {kind: rigid_body_properties, carriers: [artifact_ref], schema_name: RigidBodyProperties, schema_version: "1.0"}

  - name: rigid_body_assignment
    version: 1
    inputs:
      source_asset: {kind: asset_definition, carriers: [artifact_ref]}
      properties: {kind: rigid_body_properties, carriers: [artifact_ref], schema_name: RigidBodyProperties, schema_version: "1.0"}
      collision: {kind: collision_mesh, carriers: [artifact_ref], requires_frame: true, requires_unit: true}
    outputs:
      asset: {kind: asset_definition, carriers: [artifact_ref]}
      report: {kind: quality_report, carriers: [artifact_ref]}

  - name: rigid_body_release
    version: 1
    inputs:
      source_release: {kind: asset_release, carriers: [artifact_ref]}
      asset: {kind: asset_definition, carriers: [artifact_ref]}
      properties: {kind: rigid_body_properties, carriers: [artifact_ref], schema_name: RigidBodyProperties, schema_version: "1.0"}
      report: {kind: quality_report, carriers: [artifact_ref]}
    outputs:
      release: {kind: asset_release, carriers: [artifact_ref]}

  - name: usd_export
    version: 1
    inputs:
      asset: {kind: asset_definition, carriers: [artifact_ref]}
      release: {kind: asset_release, carriers: [artifact_ref]}
    outputs:
      usd: {kind: usd_asset, carriers: [artifact_ref], schema_name: OpenUSD, schema_version: "1.0", requires_frame: true, requires_unit: true}
      textures: {kind: texture_2d, cardinality: zero_or_more, carriers: [artifact_ref]}
      report: {kind: quality_report, carriers: [artifact_ref]}

  - name: usd_release
    version: 1
    inputs:
      source_release: {kind: asset_release, carriers: [artifact_ref]}
      asset: {kind: asset_definition, carriers: [artifact_ref]}
      usd: {kind: usd_asset, carriers: [artifact_ref], schema_name: OpenUSD, schema_version: "1.0", requires_frame: true, requires_unit: true}
      report: {kind: quality_report, carriers: [artifact_ref]}
    outputs:
      release: {kind: asset_release, carriers: [artifact_ref]}

  - name: assemble_asset
    version: 1
    inputs:
      mesh: {kind: triangle_mesh, carriers: [artifact_ref], requires_frame: true, requires_unit: true}
      material: {kind: pbr_material, carriers: [structured]}
      spatial: {kind: asset_spatial_info, carriers: [structured]}
      quality: {kind: quality_report, carriers: [artifact_ref]}
      observations: {kind: observation_bundle, carriers: [artifact_ref], schema_name: ObservationBundle, schema_version: "1.0"}
      components: {kind: component_provenance, cardinality: zero_or_more, carriers: [structured]}
      semantics: {kind: semantic_info, cardinality: zero_or_one, carriers: [structured]}
    outputs:
      asset: {kind: asset_definition, carriers: [structured], persist: true}

  - name: shape_asset_assembly
    version: 1
    relations:
      - validator: shape_asset_inputs@1
        inputs: [mesh, image, quality, spatial, observations]
    inputs:
      mesh: {kind: triangle_mesh, carriers: [artifact_ref], requires_frame: true, requires_unit: true}
      image: {kind: rgba_image, carriers: [artifact_ref]}
      quality: {kind: quality_report, carriers: [artifact_ref], schema_name: QualityReport, schema_version: "1.0"}
      spatial: {kind: asset_spatial_info, carriers: [structured]}
      observations: {kind: observation_bundle, cardinality: zero_or_one, carriers: [artifact_ref], schema_name: ObservationBundle, schema_version: "1.0"}
    outputs:
      asset: {kind: asset_definition, carriers: [artifact_ref], schema_name: AssetDefinition, schema_version: "1.0"}

  - name: masked_shape_asset_assembly
    version: 1
    relations:
      - validator: shape_asset_inputs@1
        inputs: [mesh, image, quality, spatial, sam3d_evidence, actual_mask]
    inputs:
      mesh: {kind: triangle_mesh, carriers: [artifact_ref], requires_frame: true, requires_unit: true}
      image: {kind: rgb_image, carriers: [artifact_ref]}
      quality: {kind: quality_report, carriers: [artifact_ref], schema_name: QualityReport, schema_version: "1.0"}
      spatial: {kind: asset_spatial_info, carriers: [structured]}
      sam3d_evidence: {kind: remote_job_result, carriers: [artifact_ref], schema_name: Sam3DResult, schema_version: "1.0"}
      actual_mask: {kind: binary_mask, carriers: [artifact_ref], schema_name: png, schema_version: "1.0"}
    outputs:
      asset: {kind: asset_definition, carriers: [artifact_ref], schema_name: AssetDefinition, schema_version: "1.0"}

  - name: asset_export
    version: 1
    inputs:
      asset: {kind: asset_definition, carriers: [artifact_ref], schema_name: AssetDefinition, schema_version: "1.0"}
    outputs:
      glb: {kind: gltf_asset, carriers: [artifact_ref], requires_frame: true, requires_unit: true}
      release: {kind: asset_release, carriers: [artifact_ref], schema_name: AssetRelease, schema_version: "1.0"}

  - name: export
    version: 1
    inputs:
      asset: {kind: asset_definition, carriers: [artifact_ref]}
      mesh: {kind: triangle_mesh, carriers: [artifact_ref], requires_frame: true, requires_unit: true}
      material: {kind: pbr_material, carriers: [structured], schema_name: PBRMaterial, schema_version: "1.0"}
      quality: {kind: quality_report, carriers: [artifact_ref]}
      profile: {kind: export_profile, carriers: [structured]}
    outputs:
      glb: {kind: gltf_asset, carriers: [artifact_ref], requires_frame: true, requires_unit: true}
      release: {kind: asset_release, carriers: [structured], persist: true}

  - name: align_candidate
    version: 1
    inputs:
      candidate: {kind: completion_candidate, carriers: [artifact_ref], schema_name: CompletionCandidate, schema_version: "1.0"}
      transform: {kind: spatial_transform, carriers: [structured], schema_name: SpatialTransform, schema_version: "1.0"}
    outputs:
      aligned: {kind: gltf_asset, carriers: [artifact_ref], requires_frame: true, requires_unit: true}
      transform: {kind: spatial_transform, carriers: [artifact_ref], schema_name: SpatialTransform, schema_version: "1.0"}

  - name: manual_region_composition
    version: 1
    inputs:
      selection: {kind: alignment_selection, carriers: [artifact_ref], schema_name: AlignmentSelection, schema_version: "1.0"}
    outputs:
      asset: {kind: asset_definition, carriers: [artifact_ref]}
      release: {kind: asset_release, carriers: [artifact_ref]}
      quality: {kind: quality_report, carriers: [artifact_ref]}
      exported: {kind: gltf_asset, carriers: [artifact_ref], requires_frame: true, requires_unit: true}
      components: {kind: triangle_mesh, cardinality: one_or_more, carriers: [artifact_ref], requires_frame: true, requires_unit: true}
      mesh: {kind: gltf_asset, carriers: [artifact_ref], requires_frame: true, requires_unit: true}
      regions: {kind: region_selection, carriers: [artifact_ref], schema_name: RegionSelection, schema_version: "1.0"}
      manifest: {kind: component_composition, carriers: [artifact_ref], schema_name: ComponentComposition, schema_version: "1.0"}
      provenance: {kind: provenance_record, carriers: [artifact_ref]}

  - name: assemble_scene
    version: 1
    inputs:
      request: {kind: scene_request, carriers: [artifact_ref], schema_name: SceneRequest, schema_version: "1.0"}
    outputs:
      scene: {kind: scene_definition, carriers: [artifact_ref], schema_name: SceneDefinition, schema_version: "1.0"}
      instances: {kind: asset_instance, cardinality: one_or_more, carriers: [artifact_ref], schema_name: AssetInstance, schema_version: "1.0"}
      glb: {kind: gltf_asset, carriers: [artifact_ref], requires_frame: true, requires_unit: true}
      scene_provenance: {kind: provenance_record, carriers: [artifact_ref]}
      glb_provenance: {kind: provenance_record, carriers: [artifact_ref]}

  - name: instance_proposals
    version: 1
    inputs:
      image: {kind: rgb_image, carriers: [artifact_ref]}
    outputs:
      proposals: {kind: instance_proposals, carriers: [artifact_ref], schema_name: InstanceProposals, schema_version: "1.0"}
      provenance: {kind: provenance_record, carriers: [artifact_ref]}

  - name: workbench_mask_selection
    version: 1
    inputs:
      proposals: {kind: instance_proposals, carriers: [artifact_ref], schema_name: InstanceProposals, schema_version: "1.0"}
    outputs:
      selection: {kind: instance_selection, carriers: [artifact_ref], schema_name: InstanceSelection, schema_version: "1.0"}
      binding: {kind: quality_evidence, carriers: [artifact_ref], schema_name: SelectionInputBinding, schema_version: "1.0"}

  - name: workbench_image_workflow
    version: 1
    inputs:
      binding: {kind: quality_evidence, carriers: [artifact_ref], schema_name: SelectionInputBinding, schema_version: "1.0"}
    outputs:
      asset: {kind: asset_definition, carriers: [artifact_ref], schema_name: AssetDefinition, schema_version: "1.0"}
      release: {kind: asset_release, carriers: [artifact_ref], schema_name: AssetRelease, schema_version: "1.0"}
      qa: {kind: quality_report, carriers: [artifact_ref]}
      glb: {kind: gltf_asset, carriers: [artifact_ref], requires_frame: true, requires_unit: true}

  - name: selection_prepare
    version: 1
    inputs:
      binding: {kind: quality_evidence, carriers: [artifact_ref], schema_name: SelectionInputBinding, schema_version: "1.0"}
    outputs:
      rgba: {kind: rgba_image, carriers: [artifact_ref]}
      observations: {kind: observation_bundle, carriers: [artifact_ref], schema_name: ObservationBundle, schema_version: "1.0"}
      verification: {kind: quality_evidence, carriers: [artifact_ref], schema_name: SelectionImportVerification, schema_version: "1.0"}

  - name: text_segmentation
    version: 1
    inputs:
      image: {kind: rgb_image, carriers: [artifact_ref]}
    outputs:
      mask: {kind: binary_mask, carriers: [artifact_ref], schema_name: png, schema_version: "1.0"}
      candidates: {kind: remote_job_result, carriers: [artifact_ref], schema_name: TextMaskCandidates, schema_version: "1.0"}

  - name: select_text_mask
    version: 1
    inputs:
      candidates: {kind: remote_job_result, carriers: [artifact_ref], schema_name: TextMaskCandidates, schema_version: "1.0"}
    outputs:
      mask: {kind: binary_mask, carriers: [artifact_ref], schema_name: png, schema_version: "1.0"}

  - name: text_segmentation
    version: 2
    relations:
      - validator: independent_inputs@1
        inputs: [image, text]
    inputs:
      image: {kind: rgb_image, carriers: [artifact_ref]}
      text: {kind: text, carriers: [artifact_ref], schema_name: plain_text, schema_version: "1.0"}
    outputs:
      mask: {kind: binary_mask, carriers: [artifact_ref], schema_name: png, schema_version: "1.0"}
      candidates: {kind: remote_job_result, carriers: [artifact_ref], schema_name: TextMaskCandidates, schema_version: "1.0"}
