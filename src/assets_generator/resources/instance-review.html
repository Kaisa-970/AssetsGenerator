<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>实例候选检查</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui;color:#17202a;background:#f4f6f8}main{display:grid;grid-template-columns:minmax(280px,360px) 1fr;height:100vh}aside{padding:20px;overflow:auto;background:#fff;border-right:1px solid #ccd3da}h1{font-size:21px;margin-top:0}p{line-height:1.5;color:#506070}label{display:block;margin:12px 0}input[type=text]{width:100%;padding:8px;border:1px solid #8796a5;border-radius:4px}.proposal{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #e1e5e9}.proposal strong{overflow-wrap:anywhere}.meta{grid-column:2/4;color:#64717d;font-size:12px}.order{display:flex;gap:4px}.order button{width:30px;height:30px;padding:0}button{border:1px solid #768695;border-radius:4px;background:#eef2f5;padding:8px 12px;cursor:pointer}button.primary{width:100%;background:#126b52;color:#fff;border-color:#126b52;font-weight:600}button:disabled{opacity:.45;cursor:default}#viewport{min-width:0;display:grid;place-items:center;padding:20px;overflow:auto}#canvas-wrap{position:relative;max-width:100%;max-height:100%}canvas{display:block;max-width:100%;max-height:calc(100vh - 40px);background:#dce1e5;box-shadow:0 2px 12px #0002}#status{white-space:pre-wrap;overflow-wrap:anywhere}.selected{color:#126b52;font-weight:600}@media(max-width:760px){main{grid-template-columns:1fr;height:auto}aside{border-right:0;border-bottom:1px solid #ccd3da}#viewport{height:60vh}canvas{max-height:calc(60vh - 40px)}}
</style>
<main><aside><h1>实例候选检查</h1><p>勾选需要生成的 mask，使用箭头调整输出顺序。叠加颜色仅用于检查，候选语义仍为 unknown。</p>
<div id="proposals"></div><label>检查人<input id="reviewer" type="text" maxlength="200" autocomplete="name" placeholder="姓名或标识"></label><button id="publish" class="primary" disabled>发布所选实例</button><p id="status" role="status">正在加载候选…</p></aside><section id="viewport"><div id="canvas-wrap"><canvas id="canvas"></canvas></div></section></main>
<script>
const $=id=>document.getElementById(id), colors=['#e63946','#2a9d8f','#f4a261','#457b9d','#9b5de5','#e9c46a','#00a8e8','#ef476f'];
let config, source, masks=[], selected=[];
function loadImage(url){return new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>resolve(image);image.onerror=()=>reject(Error('图像加载失败'));image.src=url})}
function draw(){if(!source)return;const canvas=$('canvas'),ctx=canvas.getContext('2d');canvas.width=source.naturalWidth;canvas.height=source.naturalHeight;ctx.drawImage(source,0,0);selected.forEach((id,order)=>{const index=config.items.findIndex(item=>item.proposal_id===id),temp=document.createElement('canvas');temp.width=canvas.width;temp.height=canvas.height;const tc=temp.getContext('2d');tc.drawImage(masks[index],0,0);tc.globalCompositeOperation='source-in';tc.fillStyle=colors[order%colors.length]+'99';tc.fillRect(0,0,temp.width,temp.height);ctx.drawImage(temp,0,0)});renderList()}
function move(id,delta){const index=selected.indexOf(id),target=index+delta;if(index<0||target<0||target>=selected.length)return;[selected[index],selected[target]]=[selected[target],selected[index]];draw()}
function renderList(){const root=$('proposals');root.replaceChildren(...config.items.map(item=>{const row=document.createElement('div');row.className='proposal';const checked=selected.includes(item.proposal_id),order=selected.indexOf(item.proposal_id);const box=document.createElement('input');box.type='checkbox';box.checked=checked;box.setAttribute('aria-label','选择 '+item.proposal_id);box.onchange=()=>{if(box.checked)selected.push(item.proposal_id);else selected=selected.filter(id=>id!==item.proposal_id);draw()};const name=document.createElement('strong');name.textContent=(checked?(order+1)+'. ':'')+item.proposal_id;name.className=checked?'selected':'';const controls=document.createElement('div');controls.className='order';for(const [label,delta] of [['↑',-1],['↓',1]]){const button=document.createElement('button');button.type='button';button.textContent=label;button.title=delta<0?'前移':'后移';button.disabled=!checked||(delta<0?order===0:order===selected.length-1);button.onclick=()=>move(item.proposal_id,delta);controls.append(button)}const meta=document.createElement('div');meta.className='meta';meta.textContent='area '+item.area+' · IoU '+item.predicted_iou+' · stability '+item.stability_score;row.append(box,name,controls,meta);return row}));$('publish').disabled=selected.length===0}
async function post(body){const response=await fetch('/publish',{method:'POST',headers:{'Content-Type':'application/json','X-Review-Token':config.token},body:JSON.stringify(body)});const result=await response.json();if(!response.ok)throw Error(result.error||'发布失败');return result}
$('publish').onclick=async()=>{const reviewer=$('reviewer').value.trim();if(!reviewer){$('status').textContent='请填写检查人。';return}for(const element of document.querySelectorAll('input,button'))element.disabled=true;$('status').textContent='正在发布选择…';try{const result=await post({proposal_ids:selected,reviewer});$('status').textContent='已发布 '+selected.length+' 个实例。\n'+result.manifest}catch(error){$('status').textContent='发布失败：'+error.message;for(const element of document.querySelectorAll('input,button'))element.disabled=false;renderList()}}
(async()=>{try{config=await fetch('/session').then(response=>{if(!response.ok)throw Error('无法读取候选');return response.json()});source=await loadImage(config.image.url);masks=await Promise.all(config.items.map(item=>loadImage(item.mask_url)));renderList();draw();$('status').textContent=config.items.length?'请选择候选并填写检查人。':'当前没有候选。';document.body.dataset.ready='true'}catch(error){$('status').textContent='加载失败：'+error.message}})();
</script></html>
