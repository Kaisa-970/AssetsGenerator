pipeline: sam3_text_extract_v1
version: 1
inputs:
  image: {kind: rgb_image, carriers: [artifact_ref]}
nodes:
  segment:
    operator: text_segmentation@1
    backend: sam3
    parameters: {prompt: chair, confidence: 0.5}
    inputs:
      image: pipeline.inputs.image
  extract:
    operator: apply_binary_mask@1
    adapter: apply_binary_mask@1
    inputs:
      image: pipeline.inputs.image
      mask: segment.outputs.mask
