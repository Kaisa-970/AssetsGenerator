# Static contract example; execution requires a registered ComfyUI adapter/service.
pipeline: comfy_image_chain_v1
version: 1
inputs:
  image: {kind: rgb_image, carriers: [artifact_ref], schema_name: png, schema_version: "1.0"}
nodes:
  first:
    operator: image_transform@1
    backend: comfy_first
    inputs:
      image: pipeline.inputs.image
  second:
    operator: image_transform@1
    backend: comfy_second
    inputs:
      image: first.outputs.image
