[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "assets-generator"
version = "0.1.0"
description = "Real-to-Sim asset compiler"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "Pillow>=10",
    "PyYAML>=6",
    "trimesh>=4.4",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[project.scripts]
assets-generator = "assets_generator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"assets_generator.resources" = ["*.yaml", "*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["assets_generator"]

[[tool.mypy.overrides]]
module = [
    "assets_generator.backends.trellis2_runner",
    "assets_generator.backends.birefnet_runner",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = "assets_generator.operators"
disallow_untyped_calls = false
